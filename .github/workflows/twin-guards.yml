name: Twin-file drift guards

# The cross-language "twin" guards (a pytest test that reads a client src/ or app/ file
# and asserts it matches a server value) live in the pytest suite. On a SERVER change,
# python-tests.yml already runs the whole suite (every `crosslang`-marked guard, unscoped),
# so this job only needs to cover the gap that leaves: a CLIENT-only PR, which skips
# python-tests.yml entirely and can't run pytest from client-tests.yml. Firing on the
# server paths too would just run these guards a SECOND time for no added protection
# (WHIT-453, trimming the double run WHIT-436 introduced).
#
# So this job fires ONLY on client (src/, app/) changes and runs the `crosslang` marker
# (pytest.ini) unscoped — no hand-maintained filename list; tests/conftest.py fails an
# unmarked test that reads a client file, so the selector can't rot. test_twin_guards_job.py
# pins this trigger + command AND that python-tests.yml still runs the full suite, so the
# "server side is covered elsewhere" assumption this narrowing rests on can't drift silently.
#
# Caveat (same as the other two workflows): if branch protection marks this a REQUIRED
# check, a path-skipped run reads "pending" and can block a PR that touches none of the
# paths below — keep the paths and the job name (`crosslang`) stable if so.
on:
  pull_request:
    paths:
      - "src/**"        # client source (tests/shared/_chart_ramp.py:_CLIENT_DIRS)
      - "app/**"        # client source — the ramp file has moved dirs before (WHIT-408)
      - ".github/workflows/twin-guards.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosslang:
    name: crosslang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Lambda runtime (terraform/lambda.tf: python3.12).
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r lambda_sync_trigger/requirements-dev.txt

      # Only the twin guards, selected by marker — unscoped, so a marked guard in any
      # directory is picked up. No --cov: this is a fast guard, the two suites own coverage.
      - name: Run the cross-language twin guards
        run: python -m pytest -m crosslang
